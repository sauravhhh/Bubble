<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital Bubble Wrap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
        }

        .header {
            text-align: center;
            padding: 20px 15px;
            color: #333;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #444;
            font-weight: 700;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 20px;
            color: #555;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s ease;
            font-size: 0.9rem;
        }

        .bubble-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .bubble {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #f0f0f0);
            border: 2px solid rgba(200, 200, 200, 0.5);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 
                inset -3px -3px 8px rgba(0,0,0,0.08),
                inset 3px 3px 8px rgba(255,255,255,0.8),
                0 3px 10px rgba(0,0,0,0.1);
            animation: bubbleAppear 0.4s ease-out;
        }

        @keyframes bubbleAppear {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .bubble:active {
            transform: scale(0.95);
        }

        .bubble.popping {
            animation: pop 0.4s ease-out forwards;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
                background: radial-gradient(circle at 50% 50%, #ffffff, #ffe0e0);
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(100, 100, 100, 0.3);
            transform: scale(0);
            animation: rippleEffect 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(200, 200, 200, 0.5);
            color: #555;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .sound-toggle:active {
            transform: scale(0.9);
        }

        .footer {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #777;
            font-size: 0.85rem;
            text-align: center;
            z-index: 100;
            background: rgba(245, 245, 245, 0.9);
            padding: 5px 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(150, 150, 150, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFly 0.8s ease-out forwards;
        }

        @keyframes particleFly {
            to {
                transform: translate(var(--x), var(--y)) scale(0);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }
            
            .bubble {
                width: 60px;
                height: 60px;
            }
            
            .bubble-container {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
                gap: 6px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🫧 Bubble Wrap 🫧</h1>
        <p>Tap the bubbles to pop them!</p>
        <div class="stats">
            <div class="stat-item">
                <span>Bubbles Popped: </span>
                <span id="popCount">0</span>
            </div>
        </div>
    </div>

    <button class="sound-toggle" id="soundToggle" title="Toggle Sound">
        🔊
    </button>

    <div class="bubble-container" id="bubbleContainer"></div>

    <div class="footer">
        Made with ❤️ by Sauravhhh
    </div>

    <script>
        class BubbleWrap {
            constructor() {
                this.container = document.getElementById('bubbleContainer');
                this.popCount = 0;
                this.soundEnabled = true;
                
                this.init();
                this.setupAudio();
                this.createInitialBubbles();
            }

            init() {
                // Sound toggle
                document.getElementById('soundToggle').addEventListener('click', () => {
                    this.soundEnabled = !this.soundEnabled;
                    document.getElementById('soundToggle').textContent = this.soundEnabled ? '🔊' : '🔇';
                });
            }

            setupAudio() {
                // Create audio context for pop sounds
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            playPopSound() {
                if (!this.soundEnabled) return;

                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);

                oscillator.frequency.setValueAtTime(800, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, this.audioContext.currentTime + 0.1);

                gainNode.gain.setValueAtTime(0.2, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.1);

                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + 0.1);
            }

            createBubble() {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                
                // Touch events for mobile
                bubble.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.popBubble(e.touches[0], bubble);
                });
                
                // Mouse events for desktop
                bubble.addEventListener('click', (e) => {
                    this.popBubble(e, bubble);
                });
                
                return bubble;
            }

            createInitialBubbles() {
                this.createBubbles(50);
            }

            createBubbles(count) {
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const bubble = this.createBubble();
                        this.container.appendChild(bubble);
                    }, i * 20);
                }
            }

            popBubble(event, bubble) {
                if (bubble.classList.contains('popping')) return;

                bubble.classList.add('popping');
                this.playPopSound();
                
                // Update stats
                this.popCount++;
                document.getElementById('popCount').textContent = this.popCount;

                // Create ripple effect
                this.createRipple(event, bubble);

                // Create particles
                this.createParticles(event);

                // Remove bubble and create new one
                setTimeout(() => {
                    bubble.remove();
                    // Automatically add new bubble to keep the experience endless
                    const newBubble = this.createBubble();
                    this.container.appendChild(newBubble);
                }, 400);
            }

            createRipple(event, bubble) {
                const rect = bubble.getBoundingClientRect();
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                
                const size = 20;
                ripple.style.width = ripple.style.height = `${size}px`;
                ripple.style.left = `${event.clientX - rect.left - size/2}px`;
                ripple.style.top = `${event.clientY - rect.top - size/2}px`;
                
                bubble.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 600);
            }

            createParticles(event) {
                const particleCount = 4 + Math.floor(Math.random() * 4);
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    
                    const angle = (Math.PI * 2 * i) / particleCount;
                    const velocity = 40 + Math.random() * 40;
                    const x = Math.cos(angle) * velocity;
                    const y = Math.sin(angle) * velocity;
                    
                    particle.style.setProperty('--x', `${x}px`);
                    particle.style.setProperty('--y', `${y}px`);
                    particle.style.left = `${event.clientX}px`;
                    particle.style.top = `${event.clientY}px`;
                    
                    document.body.appendChild(particle);
                    
                    setTimeout(() => particle.remove(), 800);
                }
            }
        }

        // Initialize the bubble wrap when the page loads
        window.addEventListener('DOMContentLoaded', () => {
            new BubbleWrap();
        });
    </script>
</body>
  </html>
